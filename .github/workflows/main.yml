name: WeatherTraq Update

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WeatherTraq pipeline
        run: |
          python powerbi/weather_pipeline.py

      - name: Commit updated weather data
        run: |
          git config --global user.name "WeatherTraq Bot"
          git config --global user.email "weathertraq-bot@users.noreply.github.com"

          git add powerbi/*.csv

          git diff --cached --quiet || git commit -m "Update WeatherTraq weather data"

          git push
